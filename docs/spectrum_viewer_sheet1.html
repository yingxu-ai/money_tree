function fmtVal(v) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "number") {
    if (!Number.isFinite(v)) return "—";
    const a = Math.abs(v);
    if (a !== 0 && (a < 1e-3 || a >= 1e4)) return v.toExponential(3);
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1e6) / 1e6);
  }
  return String(v);
}

function buildHover(metaCols, meta, wave, y) {
  const lines = metaCols.map(c => "<b>" + c + "</b>: " + fmtVal(meta[c]));
  lines.push("<b>波长</b>: " + fmtVal(wave) + " nm");
  lines.push("<b>吸光度</b>: " + fmtVal(y));
  return lines.join("<br>");
}

function parseFilter(text) {
  text = (text || "").trim();
  if (!text) return null;
  const set = new Set();
  for (const part of text.split(/[,，\s]+/)) {
    if (!part) continue;
    const m = part.match(/^(\d+)\s*[-~～]\s*(\d+)$/);
    if (m) {
      let a = +m[1], b = +m[2];
      if (a > b) { const t = a; a = b; b = t; }
      for (let i = a; i <= b; i++) set.add(i);
    } else if (/^\d+$/.test(part)) {
      set.add(+part);
    }
  }
  return set.size ? set : null;
}

function makeTraces(rowFilter) {
  const out = [];
  DATA.rows.forEach((r, idx) => {
    if (rowFilter && !rowFilter.has(r.excel_row)) return;
    const color = COLORS[idx] || COLORS[idx % COLORS.length];
    out.push({
      type: "scatter",
      mode: "lines",
      name: "第" + r.excel_row + "行",
      x: DATA.waves,
      y: r.y,
      line: { color: color, width: 1.6 },
      hovertemplate: "%{hovertext}<extra></extra>",
      hovertext: DATA.waves.map((w, j) => buildHover(DATA.meta_cols, r.meta, w, r.y[j])),
    });
  });
  return out;
}

function render(filterSet) {
  Plotly.react("chart", makeTraces(filterSet), layout, config);
}
