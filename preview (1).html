<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<title>Intelligent Application</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at center,#123047,#02070c 70%);

    color:white;
    font-family:
    "Microsoft YaHei",
    Arial;

}


/* 背景扫描 */

body:before{

content:"";

position:absolute;

width:100%;
height:100%;

background:
linear-gradient(
transparent 95%,
rgba(0,200,255,.08)
);

background-size:
100% 6px;

opacity:.25;

}



/* 顶部 */

.header{

position:absolute;

top:70px;

width:100%;

text-align:center;

}


.header h1{

font-size:48px;

letter-spacing:12px;

}


.header p{

margin-top:15px;

color:#6da5c5;

font-size:18px;

letter-spacing:8px;

}


/* 核心舱 */

.core{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

width:520px;
height:620px;

perspective:1200px;

}



/* 门 */

.door{

position:absolute;

width:100%;
height:100%;

display:flex;

overflow:hidden;

}



/* 左右装甲门 —— 直接为展开后的终态，无开门动画 */

.panel{

width:50%;

height:100%;


background:

linear-gradient(
135deg,
#0b1e2c,
#17394d,
#06131d
);


border:

2px solid #2b718f;


box-shadow:

0 0 40px rgba(0,180,255,.25);

}


.left{

transform-origin:left;

transform:

rotateY(-100deg);

}


.right{

transform-origin:right;

transform:

rotateY(100deg);

}



/* 登录 —— 展开后直接显示 */

.login{

position:absolute;

top:50%;
left:50%;

transform:

translate(-50%,-50%);


width:340px;

z-index:1;

}


.login h2{

text-align:center;

font-size:28px;

letter-spacing:6px;

margin-bottom:35px;

}



input{

width:100%;

height:48px;

margin-bottom:20px;


background:

rgba(0,0,0,.5);


border:

1px solid #28617d;


color:white;

padding-left:15px;

font-size:16px;

}


.password-wrap{

position:relative;

margin-bottom:20px;

}


.password-wrap input{

margin-bottom:0;

padding-right:48px;

}


.eye-btn{

position:absolute;

right:12px;

top:50%;

transform:translateY(-50%);

width:28px;

height:28px;

border:none;

background:transparent;

color:#6da5c5;

cursor:pointer;

padding:0;

display:flex;

align-items:center;

justify-content:center;

}


.eye-btn:hover{

color:#00d8ff;

}


.eye-btn svg{

width:20px;

height:20px;

fill:none;

stroke:currentColor;

stroke-width:1.8;

stroke-linecap:round;

stroke-linejoin:round;

}


.remember{

display:flex;

align-items:center;

gap:10px;

margin-bottom:22px;

color:#6da5c5;

font-size:14px;

letter-spacing:2px;

cursor:pointer;

user-select:none;

}


.remember input{

width:16px;

height:16px;

margin:0;

accent-color:#00d8ff;

cursor:pointer;

}



.login-btn{


width:100%;

height:50px;


background:

linear-gradient(
90deg,
#0078ff,
#00d8ff
);


border:none;


color:white;

font-size:18px;


letter-spacing:4px;


cursor:pointer;


}


/* 底部 */


.footer{


position:absolute;

bottom:60px;

width:100%;


text-align:center;


color:#6b91a8;

letter-spacing:4px;

}


.status{


position:absolute;

bottom:25px;

width:100%;


text-align:center;


color:#00d8ff;

font-size:14px;


}



</style>


</head>


<body>



<div class="header">

<h1>智能应用平台</h1>

<p>Intelligent Application</p>

</div>



<div class="core">


<div class="door">


<div class="panel left"></div>

<div class="panel right"></div>



<div class="login">


<h2>身份认证</h2>


<input placeholder="账号">


<div class="password-wrap">

<input
id="password"
type="password"
placeholder="密码">

<button
type="button"
class="eye-btn"
id="eyeBtn"
aria-label="显示密码"
title="显示/隐藏密码">

<svg id="eyeIcon" viewBox="0 0 24 24">
<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
<circle cx="12" cy="12" r="3"/>
</svg>

</button>

</div>


<label class="remember">

<input type="checkbox" checked>

记住登录状态

</label>


<button type="button" class="login-btn">

启动

</button>


</div>


</div>


</div>




<div class="footer">

<!-- DATA　|　MODEL　|　KNOWLEDGE　|　AGENT -->
AI · RAG · Agent · Model Service · Digital Twin
</div>
<!-- AI · RAG · Agent · Model Service · Digital Twin系统安全认证中... -->

<div class="status">

<!-- SYSTEM AUTHENTICATION... -->
系统安全认证中...

</div>




<script>

(function () {
  var input = document.getElementById("password");
  var btn = document.getElementById("eyeBtn");
  var icon = document.getElementById("eyeIcon");

  var eyeOpen =
    '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
  var eyeOff =
    '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

  btn.addEventListener("click", function () {
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    icon.innerHTML = show ? eyeOpen : eyeOff;
    btn.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  });

  // 默认密文：闭眼图标
  icon.innerHTML = eyeOff;
})();

</script>


</body>

</html>
