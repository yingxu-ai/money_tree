<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工单管理</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#718096;--line:#e6eaf0;--blue:#2563eb;--blue2:#dbeafe;--green:#16a34a;--orange:#ea580c;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:220px;background:#101827;color:#dbe5f2;padding:22px 14px}.brand{font-size:19px;font-weight:800;padding:0 12px 25px}.nav a{display:block;color:#b8c4d6;text-decoration:none;padding:12px;border-radius:9px;margin:5px 0}.nav a.active,.nav a:hover{background:#26364f;color:white}.main{flex:1;padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.title{font-size:26px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:6px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.warn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{font-size:28px;font-weight:800;margin-top:8px}.label{font-size:13px;color:var(--muted)}.section-title{font-weight:800;font-size:16px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600;background:#fafbfc}.tag{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;background:#eef2ff;color:#4338ca}.tag.green{background:#dcfce7;color:#166534}.tag.orange{background:#ffedd5;color:#9a3412}.tag.red{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--text)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--blue)}.small{font-size:12px;color:var(--muted)}.footer-note{color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:900px){.side{width:70px}.brand{font-size:0}.brand:after{content:"排产";font-size:17px}.nav a{font-size:0;text-align:center}.nav a:before{content:"●";font-size:15px}.main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.title{font-size:22px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">生产排产 MVP</div><nav class="nav"><a class="" href="01_基础数据.html">基础数据</a><a class="active" href="02_工单管理.html">工单管理</a><a class="" href="03_排产甘特.html">排产甘特</a><a class="" href="04_工序报工.html">工序报工</a></nav></aside><main class="main">
<div class="top"><div><div class="title">工单管理</div><div class="sub">创建生产任务，拆分为多个工序，并设置交期与优先级。</div></div><button class="btn primary" onclick="document.getElementById('newOrder').style.display='block'">＋ 新建工单</button></div>
<div class="cards"><div class="card"><div class="label">全部工单</div><div class="metric">18</div></div><div class="card"><div class="label">待排产</div><div class="metric">6</div></div><div class="card"><div class="label">生产中</div><div class="metric">8</div></div><div class="card"><div class="label">已完成</div><div class="metric">4</div></div></div>
<div id="newOrder" class="card" style="display:none"><div class="section-title">新建工单</div><div class="grid2"><input class="input" placeholder="工单名称"><input class="input" placeholder="产品 / 项目"><input class="input" type="date"><select class="select"><option>普通优先级</option><option>高优先级</option><option>紧急插队</option></select></div><br><button class="btn primary" onclick="alert('工单已创建，进入工序拆分');document.getElementById('newOrder').style.display='none'">创建并拆分工序</button></div>
<div class="card"><div class="toolbar"><input class="input" placeholder="搜索工单编号 / 名称"><select class="select"><option>全部状态</option><option>待排产</option><option>生产中</option><option>已完成</option></select><select class="select"><option>全部优先级</option><option>高</option><option>普通</option></select></div><table><tr><th>工单编号</th><th>工单名称</th><th>工序数</th><th>交期</th><th>优先级</th><th>状态</th><th>操作</th></tr><tr><td>WO-202609-001</td><td>设备底座加工</td><td>4</td><td>09-20</td><td><span class="tag">普通</span></td><td><span class="tag orange">待排产</span></td><td><button class="btn" onclick="alert('打开工序拆分：装配→焊接→调试→质检')">拆分工序</button></td></tr><tr><td>WO-202609-002</td><td>控制柜装配</td><td>3</td><td>09-19</td><td><span class="tag red">高</span></td><td><span class="tag green">生产中</span></td><td><button class="btn" onclick="alert('打开工单详情')">查看</button></td></tr><tr><td>WO-202609-003</td><td>空压机检修</td><td>5</td><td>09-21</td><td><span class="tag orange">插队</span></td><td><span class="tag orange">待排产</span></td><td><button class="btn" onclick="alert('打开工序拆分')">拆分工序</button></td></tr></table></div>
<div class="footer-note">MVP 演示原型 · 页面之间使用统一示例数据 · 可继续接入真实 API</div></main></div><script></script></body></html>
